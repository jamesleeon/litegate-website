# Copy to ./config.yaml in a separate directory for this demo.
# Set this address to an IP assigned to the server and an unused port.
mode: performance
entrypoints:
  web:
    address: 192.168.50.24:18091
sites_dir: ./sites
streams_dir: ./streams
dashboard:
  enabled: false
mcp:
  enabled: false
auto_cert:
  enabled: false
tls:
  enabled: false
http:
  https_port: 0
