<rect class="pill" x="940" y="179" width="200" height="38" rx="19"/><text class="pill-text" x="1040" y="203" text-anchor="middle">后端服务 2</text>
<rect class="pill" x="940" y="349" width="200" height="38" rx="19"/><text class="pill-text" x="1040" y="373" text-anchor="middle">服务器 / 虚拟机</text>
<rect class="pill" x="940" y="499" width="200" height="38" rx="19"/><text class="pill-text" x="1040" y="523" text-anchor="middle">家庭 / 机房内的服务</text>
<rect class="cap" x="400" y="117" width="360" height="46" rx="12"/><text class="cap-title" x="418" y="145">安全与身份</text><text class="cap-sub" x="742" y="144" text-anchor="end">OIDC · JWT · IDS · WAF</text>
<rect class="cap" x="400" y="181" width="360" height="46" rx="12"/><text class="cap-title" x="418" y="209">流量治理</text><text class="cap-sub" x="742" y="208" text-anchor="end">负载均衡 · 重试 · 熔断 · 限流</text>
